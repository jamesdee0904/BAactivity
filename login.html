<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="./css/login.css">
  <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js"></script>
</head>
<body>

  <div class="login-container">
    <h2>LOGIN</h2>

    <form id="loginForm" novalidate>
      
      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope"></i>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
          >
        </div>
        <span id="emailError" class="email-error"></span>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        >
        <span id="passwordError" class="password-error"></span>
      </div>

      <div class="options">
        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" id="submitBtn" class="login-btn">
        Login
      </button>
    </form>

    <div class="signup">
      Don't have an account?
      <a href="register.html">Register</a>
    </div>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

  </div>
  

  <script>
    let maxAttempts = 5;
    let remainingAttempts = maxAttempts;

    const validEmail = "user@gmail.com";
    const validPassword = "user123";

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      emailError.style.display = "none";
      emailError.textContent = "";
      passwordError.style.display = "none";
      passwordError.textContent = "";
      errorMessage.style.display = "none";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      let hasError = false;

      if (email === "") {
        emailError.textContent = "Email is required.";
        emailError.style.display = "block";
        hasError = true;
      } else if (!email.includes("@") || !email.includes(".")) {
        emailError.textContent = "Please enter a valid email address.";
        emailError.style.display = "block";
        hasError = true;
      }

      if (password === "") {
        passwordError.textContent = "Password is required.";
        passwordError.style.display = "block";
        hasError = true;
      }

      if (hasError) return;

      if (email === validEmail && password === validPassword) {
        window.location.href = "index.html";
      } else {
        remainingAttempts--;

        if (remainingAttempts > 0) {
          errorMessage.style.display = "block";
          errorMessage.textContent = `Invalid credentials. Attempts remaining: ${remainingAttempts}`;
        } else {
          errorMessage.style.display = "block";
          errorMessage.textContent = "Account locked due to too many failed attempts.";
          
          submitBtn.disabled = true;
          emailInput.disabled = true;
          passwordInput.disabled = true;
        }
      }
    });
  </script>

</body>
</html>
